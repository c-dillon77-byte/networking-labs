[project]
name = "show-parser"
version = "1.0.0"
description = "Cisco IOS/IOS-XE show-command parser (stdlib regex, optional TextFSM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
textfsm = ["ntc-templates>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
