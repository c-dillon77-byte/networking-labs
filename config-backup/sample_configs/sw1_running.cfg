! Cisco IOS Software, C2960 Software (C2960-LANBASEK9-M), Version 15.2(2)E
! Synthetic lab switch for portfolio demo — not a real device
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW1-ACCESS
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$lab$SyntheticHashNotReal01
!
username admin privilege 15 secret 5 $1$lab$SyntheticHashNotReal02
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name MGMT
!
interface FastEthernet0/1
 description Access port - PC1 synthetic
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description Access port - PC2 synthetic
 switchport access vlan 10
 switchport mode access
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/24
 description Trunk to R1-CORE - synthetic
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,99
 no shutdown
!
interface Vlan99
 description In-band management - synthetic
 ip address 192.168.99.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
line con 0
 logging synchronous
line vty 0 15
 login local
 transport input ssh
!
end
