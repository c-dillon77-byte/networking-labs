! Cisco IOS Software, C2900 Software (C2900-UNIVERSALK9-M), Version 15.7(3)M
! Synthetic lab router for portfolio demo — not a real device
!
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R1-CORE
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$lab$SyntheticHashNotReal00
!
no aaa new-model
!
ip cef
!
interface Loopback0
 description Mgmt loopback - synthetic
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description Uplink to SW1 - synthetic lab (upgraded link)
 ip address 10.10.10.1 255.255.255.252
 ip ospf network point-to-point
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description LAN to HQ users - synthetic
 ip address 192.168.10.1 255.255.255.0
 ip access-group ACL-IN in
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/2
 description WAN to Branch - synthetic
 ip address 172.16.20.1 255.255.255.252
 duplex auto
 speed auto
 no shutdown
!
router ospf 10
 router-id 10.255.0.1
 network 10.10.10.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 172.16.20.0 0.0.0.3 area 0
 network 10.255.0.1 0.0.0.0 area 0
!
ip access-list extended ACL-IN
 remark Synthetic ACL for demo — deny RFC 5737 docs from user LAN
 deny   ip any 192.0.2.0 0.0.0.255
 deny   ip any 198.51.100.0 0.0.0.255
 deny   ip any 203.0.113.0 0.0.0.255
 deny   ip any 10.66.66.0 0.0.0.255
 permit ip any any
!
ip route 0.0.0.0 0.0.0.0 172.16.20.2
!
banner motd ^C
Unauthorized access prohibited. Synthetic lab device.
^C
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
