[project]
name = "config-backup"
version = "1.0.0"
description = "Cisco config backup and diff tool (netmiko)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["netmiko>=4.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
