name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint/test tools
        run: pip install ruff pytest

      - name: Install each project's requirements
        run: |
          shopt -s nullglob globstar
          for req in **/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest) in every project subfolder
        run: |
          shopt -s nullglob
          found=0
          for dir in */; do
            if [ -d "${dir}tests" ]; then
              found=1
              echo "::group::pytest ${dir}"
              (cd "$dir" && PYTHONPATH=. python -m pytest -q)
              echo "::endgroup::"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No project tests yet, nothing to run."
          fi
